name: Build custom Vencord

# This repo holds no Vencord source of its own. The workflow clones
# upstream Vencord plus the three userplugins, builds once, and publishes
# the dist files as a rolling "latest" release that the CustomUpdater
# plugin in the build downloads from.
#
# Triggers:
# - daily schedule: picks up new upstream Vencord commits and new
#   plugin commits without any manual step. Skips the build entirely
#   if the four input SHAs are unchanged since the previous published
#   build (see the Check for changes step); no rebuild, no republish.
# - workflow_dispatch: manual run from the Actions tab. Always builds;
#   a dispatch is an explicit request, so it is not skipped.
# - push to this workflow file: a pin change in this file rebuilds.
#   Always builds; a workflow change itself is not in the SHA combo,
#   so skipping on unchanged SHAs would never test the new workflow.
# There is deliberately no trigger on upstream/plugin pushes: this repo
# does not own those repos, so it cannot receive their webhooks.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: custom-vencord-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Schedule-only skip guard. Compares the four input HEAD SHAs
      # (via ls-remote, no clones needed) against the previous published
      # version.json. Unchanged => changed=false, and every later step
      # is skipped, so a no-change day costs one short job, not a full
      # build and republish. On non-schedule runs this step is skipped,
      # its output is empty, and the later steps' != 'false' condition
      # passes, so manual and workflow-push runs always build.
      - name: Check for changes (schedule only)
        id: check
        if: github.event_name == 'schedule'
        run: |
          PREV_FILE=/tmp/prev-version.json
          curl -sL https://github.com/MLG-SERBUR/vencord-customstream-build/releases/download/latest/version.json -o "$PREV_FILE" || true
          VENCORD_SHA=$(git ls-remote https://github.com/Vendicated/Vencord.git HEAD | awk '{print $1}')
          PLUGIN_SHA=$(git ls-remote https://github.com/MrTopQ/customStream-Vencord.git HEAD | awk '{print $1}')
          UPDATER_SHA=$(git ls-remote https://github.com/MLG-SERBUR/vencord-custom-updater.git HEAD | awk '{print $1}')
          VOICE_SHA=$(git ls-remote https://github.com/MLG-SERBUR/voiceSpectrum-Vencord.git HEAD | awk '{print $1}')
          echo "Current SHAs: $VENCORD_SHA $PLUGIN_SHA $UPDATER_SHA $VOICE_SHA"
          CHANGED=true
          if [ -s "$PREV_FILE" ] && python3 -c "import json, sys; d = json.load(open(sys.argv[1])); sys.exit(0 if d.get('vencordSha') == sys.argv[2] and d.get('pluginSha') == sys.argv[3] and d.get('updaterSha') == sys.argv[4] and d.get('voiceSpectrumSha') == sys.argv[5] else 1)" "$PREV_FILE" "$VENCORD_SHA" "$PLUGIN_SHA" "$UPDATER_SHA" "$VOICE_SHA" 2>/dev/null; then
            CHANGED=false
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed: $CHANGED"

      - name: Checkout Vencord
        if: steps.check.outputs.changed != 'false'
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          ref: main
          path: vencord
          # Full history: the changelog step runs git log PREV_SHA..HEAD,
          # which needs the previous build's commit, not just HEAD.
          fetch-depth: 0

      - name: Checkout customStream plugin
        if: steps.check.outputs.changed != 'false'
        uses: actions/checkout@v4
        with:
          repository: MrTopQ/customStream-Vencord
          ref: main
          path: vencord/src/userplugins/customStream

      - name: Checkout CustomUpdater plugin
        if: steps.check.outputs.changed != 'false'
        uses: actions/checkout@v4
        with:
          repository: MLG-SERBUR/vencord-custom-updater
          ref: main
          path: vencord/src/userplugins/customUpdater.desktop

      # Fork of ced/voiceSpectrum-Vencord, owned here, trying to make
      # it work on Discord desktop (native voice engine). Upstream said
      # web/Vesktop only; desktop showed nothing, so the fork adds
      # diagnostic logging first — see its FORK.md. No suffix on the
      # folder, per the plugin's README.
      - name: Checkout voiceSpectrum plugin (fork)
        if: steps.check.outputs.changed != 'false'
        uses: actions/checkout@v4
        with:
          repository: MLG-SERBUR/voiceSpectrum-Vencord
          ref: main
          path: vencord/src/userplugins/voiceSpectrum

      - name: Setup pnpm
        if: steps.check.outputs.changed != 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        if: steps.check.outputs.changed != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.check.outputs.changed != 'false'
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      # --standalone: universal build, not tied to the Linux runner's
      # platform, so the same files run on Windows Discord desktop and
      # Vesktop. --disable-updater: the stock updater is off entirely,
      # so it can never replace this custom build with the official one.
      # CustomUpdater (a plugin in this build) is the only updater.
      - name: Build
        if: steps.check.outputs.changed != 'false'
        working-directory: vencord
        run: pnpm build --standalone --disable-updater

      - name: Verify dist files
        if: steps.check.outputs.changed != 'false'
        run: |
          ls -l vencord/dist
          for f in patcher.js preload.js renderer.js renderer.css \
                   vencordDesktopMain.js vencordDesktopPreload.js \
                   vencordDesktopRenderer.js vencordDesktopRenderer.css; do
            test -f "vencord/dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done

      - name: Write version.json
        if: steps.check.outputs.changed != 'false'
        id: version
        run: |
          VENCORD_SHA=$(git -C vencord rev-parse HEAD)
          PLUGIN_SHA=$(git -C vencord/src/userplugins/customStream rev-parse HEAD)
          UPDATER_SHA=$(git -C vencord/src/userplugins/customUpdater.desktop rev-parse HEAD)
          VOICE_SHA=$(git -C vencord/src/userplugins/voiceSpectrum rev-parse HEAD)
          VERSION="$(git -C vencord rev-parse --short HEAD)-$(git -C vencord/src/userplugins/customStream rev-parse --short HEAD)-$(git -C vencord/src/userplugins/customUpdater.desktop rev-parse --short HEAD)-$(git -C vencord/src/userplugins/voiceSpectrum rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VENCORD_SHA" "$PLUGIN_SHA" "$UPDATER_SHA" "$VOICE_SHA" "$VERSION" <<'PYEOF'
          import json, sys, datetime
          vencord_sha, plugin_sha, updater_sha, voice_sha, version = sys.argv[1:6]
          data = {
              "version": version,
              "vencordSha": vencord_sha,
              "pluginSha": plugin_sha,
              "updaterSha": updater_sha,
              "voiceSpectrumSha": voice_sha,
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "files": [
                  "patcher.js", "preload.js", "renderer.js", "renderer.css",
                  "vencordDesktopMain.js", "vencordDesktopPreload.js",
                  "vencordDesktopRenderer.js", "vencordDesktopRenderer.css",
              ],
          }
          with open("vencord/dist/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(json.dumps(data, indent=2))
          PYEOF

      # Dist files first, version.json last: CustomUpdater only acts
      # once it sees a new version in version.json, so by then every
      # dist file for that version is already uploaded.
      # -R is required: the working directory is inside the Vencord
      # checkout, so without it gh would target Vendicated/Vencord
      # (the git remote in cwd) instead of this builder repo.
      - name: Publish rolling latest release
        if: steps.check.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Changelog: upstream Vencord commits since the previous build's
          # Vencord SHA (from its version.json). Falls back to the last 20
          # commits on the first build or if the old SHA is not an ancestor.
          # This is the release-notes equivalent of the stock updater's
          # changelog tab; the builder repo itself has no Vencord history
          # to compare against.
          PREV_SHA=""
          if gh release download latest -R MLG-SERBUR/vencord-customstream-build -p version.json -D /tmp/prev-version >/dev/null 2>&1; then
            PREV_SHA=$(python3 -c "import json; print(json.load(open('/tmp/prev-version/version.json')).get('vencordSha', ''))" 2>/dev/null || true)
          fi
          CHANGELOG=""
          if [ -n "$PREV_SHA" ]; then
            CHANGELOG=$(git -C vencord log --format='- %h %s' "$PREV_SHA..HEAD" 2>/dev/null | head -50 || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git -C vencord log --format='- %h %s' -20)
          fi
          {
            echo "Custom Vencord build $VERSION"
            echo ""
            echo "Vencord: $(git -C vencord rev-parse HEAD)"
            echo "customStream: $(git -C vencord/src/userplugins/customStream rev-parse HEAD)"
            echo "CustomUpdater: $(git -C vencord/src/userplugins/customUpdater.desktop rev-parse HEAD)"
            echo "VoiceSpectrum: $(git -C vencord/src/userplugins/voiceSpectrum rev-parse HEAD)"
            echo ""
            echo "Upstream Vencord changes since previous build:"
            echo "$CHANGELOG"
          } > /tmp/release-notes.md
          cd vencord/dist
          if gh release view latest -R MLG-SERBUR/vencord-customstream-build >/dev/null 2>&1; then
            gh release upload latest --clobber -R MLG-SERBUR/vencord-customstream-build \
              patcher.js preload.js renderer.js renderer.css \
              vencordDesktopMain.js vencordDesktopPreload.js \
              vencordDesktopRenderer.js vencordDesktopRenderer.css
          else
            gh release create latest -R MLG-SERBUR/vencord-customstream-build \
              --title "Custom Vencord Build $VERSION" \
              --notes-file /tmp/release-notes.md \
              patcher.js preload.js renderer.js renderer.css \
              vencordDesktopMain.js vencordDesktopPreload.js \
              vencordDesktopRenderer.js vencordDesktopRenderer.css
          fi
          gh release upload latest --clobber -R MLG-SERBUR/vencord-customstream-build version.json
          gh release edit latest -R MLG-SERBUR/vencord-customstream-build \
            --title "Custom Vencord Build $VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Skip notice (schedule, unchanged)
        if: github.event_name == 'schedule' && steps.check.outputs.changed == 'false'
        run: echo "No changes since previous build; skipped build and publish."
